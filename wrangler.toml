name = "news18"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Real headless browser, used only when a plain fetch to loc.gov is blocked.
browser = { binding = "MYBROWSER" }

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first, handles /api/*, and hands everything else to the static assets.
run_worker_first = true
