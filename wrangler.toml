name = "news18"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first, handles /api/*, and hands everything else to the static assets.
run_worker_first = true

[vars]
# Paste your deployed Apps Script web app URL (ends in /exec)
SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxAr0-BX2f31OtMAksAX-gcKaGUMrpiVIsn9nad1tmFrKEMrYyYinWjrzGUquc2OTvPTQ/exec"
